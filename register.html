<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Bonafide Certificate Portal</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-seal">BC</div>
        <h1>Create Student Account</h1>
        <p class="auth-sub">Register to start requesting certificates</p>

        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <form method="post" th:action="@{/register}">
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required autofocus>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="rollNumber">Roll number</label>
                    <input type="text" id="rollNumber" name="rollNumber" required>
                </div>
                <div class="field">
                    <label for="year">Year of study</label>
                    <input type="text" id="year" name="year" placeholder="e.g. 2nd Year" required>
                </div>
            </div>
            <div class="field">
                <label for="department">Department</label>
                <input type="text" id="department" name="department" placeholder="e.g. Computer Science" required>
            </div>
            <button type="submit" class="btn">Create account</button>
        </form>

        <p class="auth-foot">Already have an account? <a href="/login">Sign in</a></p>
    </div>
</div>
</body>
</html>
