spring.application.name=onlinebonaFIDE

# H2 in-memory database (data resets on restart)
spring.datasource.url=jdbc:h2:mem:bonafidedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console (optional, useful for debugging): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

spring.thymeleaf.cache=false
